<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="_ds/organic-1dfbad43-51fa-418f-b963-f6ffc1b0e922/styles.css">
<script src="_ds/organic-1dfbad43-51fa-418f-b963-f6ffc1b0e922/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
</helmet>
<div style="position:absolute;left:0;right:0;bottom:0;height:96px;padding:12px 10px 34px;background:var(--color-neutral-100);border-top:1px solid var(--color-divider);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;font-family:var(--font-body)">
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ cHome }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>
    <span style="font-size:10.5px">홈</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ cRecipe }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    <span style="font-size:10.5px">레시피</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ cPlan }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="4"></rect><path d="M3 10h18"></path><path d="M8 3v3"></path><path d="M16 3v3"></path></svg>
    <span style="font-size:10.5px">일정</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ cShop }};position:relative">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle><path d="M2 3h3l2.4 11.4a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H6"></path></svg>
    <span style="font-size:10.5px">장보기</span>
    <span style="position:absolute;top:-3px;right:14px;min-width:16px;height:16px;border-radius:999px;background:var(--color-accent);color:var(--color-bg);font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px">3</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ cStock }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="4"></rect><path d="M5 10h14"></path><path d="M9 6v1"></path><path d="M9 14v2"></path></svg>
    <span style="font-size:10.5px">재료</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:96},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;recipe&quot;,&quot;plan&quot;,&quot;shop&quot;,&quot;stock&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'home';
    const on = 'var(--color-accent-700)', off = 'var(--color-neutral-600)';
    return {
      cHome: a === 'home' ? on : off,
      cRecipe: a === 'recipe' ? on : off,
      cPlan: a === 'plan' ? on : off,
      cShop: a === 'shop' ? on : off,
      cStock: a === 'stock' ? on : off,
    };
  }
}

</script>
</body>
</html>
