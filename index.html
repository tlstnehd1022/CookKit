<html lang="ko">

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CookKit" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Claude Design 핸드오프(design_handoff_cookkit_home_plan) 기준 디자인 시스템 교체 —
         제목 Jua / 본문 Gowun Dodum (예전 Noto Serif KR 전면 교체) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap"
      rel="stylesheet"
    />
    <title>CookKit</title>
  </head>
